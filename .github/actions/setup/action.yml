name: Set up Xcode and pods
description: Selects the newest Xcode, installs the pinned CocoaPods, runs pod install and checks it changed nothing tracked.
runs:
  using: composite
  steps:
    - name: Select newest Xcode
      shell: bash
      run: |
        xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
        sudo xcode-select -s "$xcode/Contents/Developer"
        xcodebuild -version

    # Xcode adds the Metal toolchain's Swift libraries to every link's search
    # paths. On the runner image the component is registered but not mounted,
    # so every target logged "ld: warning: search path ... MetalToolchain ...
    # not found". Downloading it mounts it. Not fatal if it fails.
    - name: Make the Metal toolchain available
      shell: bash
      run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Could not download the Metal toolchain"

    - name: Install the CocoaPods version from Podfile.lock
      shell: bash
      run: |
        version="$(awk '/^COCOAPODS:/ { print $2 }' Podfile.lock)"
        sudo gem install cocoapods -v "$version" --no-document
        pod --version

    - name: Cache Pods
      uses: actions/cache@v6
      with:
        path: |
          Pods
          ~/Library/Caches/CocoaPods
        key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
        restore-keys: pods-${{ runner.os }}-

    - name: pod install
      shell: bash
      run: pod install

    - name: Check Podfile.lock and project are in sync
      shell: bash
      run: scripts/check-pods-in-sync.sh
