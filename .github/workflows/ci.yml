name: CI

# Every pushed commit gets its own run (no cancel-in-progress), so each commit
# of a stacked PR can be checked on its own.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Same-repo PRs are already covered by the push event; only run
    # pull_request for forks to avoid duplicate runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install the CocoaPods version from Podfile.lock
        run: |
          version="$(awk '/^COCOAPODS:/ { print $2 }' Podfile.lock)"
          sudo gem install cocoapods -v "$version" --no-document
          pod --version

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        run: pod install

      - name: Check Podfile.lock and project are in sync
        run: scripts/check-pods-in-sync.sh

      - name: Unit tests
        run: scripts/test.sh unit

      - name: UI tests
        run: scripts/test.sh ui

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-${{ github.sha }}
          path: build/results
          if-no-files-found: ignore
