name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every pushed commit gets its own unit test run (no cancel-in-progress),
  # so each commit of a stacked PR can be checked on its own.
  unit-tests:
    # Same-repo PRs are already covered by the push event; only run
    # pull_request for forks to avoid duplicate runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: scripts/test.sh unit
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult-${{ github.sha }}
          path: build/results
          if-no-files-found: ignore

  # UI tests are slow (each test reinstalls and relaunches the app), so only
  # the newest push on a branch runs them; older runs are cancelled.
  ui-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ui-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: UI tests
        run: scripts/test.sh ui
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult-${{ github.sha }}
          path: build/results
          if-no-files-found: ignore
